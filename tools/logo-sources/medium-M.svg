<!-- Medium's M, lifted whole out of the wordmark.

     Brandfetch has no square Medium icon: what it serves as one is the
     wordmark cropped to a square, which cuts the "e" in half. The M is
     the wordmark's first subpath and opens the path, so its coordinates
     are already absolute; the d below is a byte-for-byte substring of
     https://cdn.brandfetch.io/idIlQtGZ76/theme/dark/logo.svg and the
     viewBox is the box that subpath occupies. Nothing is redrawn.

     The wordmark ships this glyph in #242424 on white. The fill here is
     white because the badge is Medium's own app icon - a black tile with
     the M knocked out of it - and the letterform, not the ink, is what
     had to come from the brand. -->

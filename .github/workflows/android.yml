name: Android

# Until now every check ran on one machine, by hand, and a pull request could
# be merged without anything having compiled. This is the floor: it builds and
# it passes its tests. Lint joins once its existing errors are cleared.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push supersedes the run for the previous one on the same branch.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Use the canonical Gradle distribution
        # The wrapper points at a Tencent mirror, which is what makes the
        # build usable from where it is developed. A GitHub runner has no
        # reason to go through it, and the mirror lagging a release would
        # fail the build for everyone. Rewritten for this run only; the file
        # in the repository is untouched.
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Validate the Gradle wrapper
        # The wrapper jar is executable code in the repository; this checks it
        # against the checksums Gradle publishes.
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches jvmTarget in android/app/build.gradle.kts.
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: android

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 7

  play-copy:
    name: Play copy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the store copy against the version being built
        # Catches a release whose notes name a version gradle will not build,
        # a language with no notes, and anything over Play's length limits.
        run: python tools/check_play_copy.py
